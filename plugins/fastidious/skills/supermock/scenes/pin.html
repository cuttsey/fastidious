<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>supermock · pin</title>
<style>
/* Artwork corner-pinned into a real photograph (billboard, bus shelter, poster site, shop window, screen). */
* { box-sizing: border-box; margin: 0; }
html, body { width: 100vw; height: 100vh; overflow: hidden; background: #000; }
.cam { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.photo { position: absolute; left: 0; top: 0; display: block; }
.art { position: absolute; left: 0; top: 0; transform-origin: 0 0; overflow: hidden; }
.art img { display: block; width: 100%; height: 100%; object-fit: cover; }
.art .haze { position: absolute; inset: 0; background: #fff; mix-blend-mode: screen; }
.art .shade { position: absolute; inset: 0; mix-blend-mode: multiply; }
.art .sheen { position: absolute; inset: -10%; background: linear-gradient(105deg, transparent 35%, rgba(255,255,255,.22) 48%, transparent 60%); mix-blend-mode: screen; }
.over { position: absolute; left: 0; top: 0; pointer-events: none; }
.dbg { position: absolute; left: 0; top: 0; overflow: visible; }
</style></head>
<body>
<div class="cam" id="cam"><img class="photo" id="photo" alt=""><div id="arts"></div><img class="over" id="over" alt=""><svg class="dbg" id="dbg"></svg></div>
<script src="supermock.js"></script>
<script>
// config: photo, size [w,h] of photo px; quads [{corners [[x,y]×4 tl,tr,br,bl], art | slides [] | frames+count+fps, slideEvery,
//   haze 0–1, shade colour (e.g. "#d8dde6" to tint toward the scene's light), sheen true, paste {t0, t1, from: 'left'|'top'}}];
// overlay (optional png with alpha, e.g. foreground branches cut from the photo); camera [{t, zoom, fx, fy}] (fx,fy = focus in photo px); debug.
SM.scene(async (c) => {
  const [pw, ph] = c.size; const photo = document.getElementById('photo'); photo.src = c.photo; photo.width = pw; photo.height = ph; await photo.decode().catch(() => {});
  const arts = document.getElementById('arts'); window._q = [];
  for (const q of c.quads) {
    const aw = q.artSize?.[0] || 1600, ah = q.artSize?.[1] || 800;
    const el = document.createElement('div'); el.className = 'art'; el.style.width = aw + 'px'; el.style.height = ah + 'px'; el.style.transform = SM.pin(aw, ah, q.corners);
    el.innerHTML = `<img alt=""><div class="shade" style="background:${q.shade || 'transparent'}"></div><div class="haze" style="opacity:${q.haze || 0}"></div>${q.sheen ? '<div class="sheen"></div>' : ''}`;
    if (q.filter) el.querySelector('img').style.filter = q.filter;
    arts.appendChild(el);
    const img = el.querySelector('img');
    window._q.push({ q, el, img, frame: q.frames ? SM.seq(img, q.frames, q.count) : null });
    if (q.art) { img.src = q.art; await img.decode().catch(() => {}); }
  }
  if (c.overlay) { const o = document.getElementById('over'); o.src = c.overlay; o.width = pw; o.height = ph; }
  if (c.debug) document.getElementById('dbg').innerHTML = c.quads.map((q) => `<polygon points="${q.corners.map((p) => p.join(',')).join(' ')}" fill="none" stroke="#f0f" stroke-width="4"/>` + q.corners.map((p, i) => `<text x="${p[0] + 8}" y="${p[1] - 8}" fill="#f0f" font-size="40">${i}</text>`).join('')).join('');
  const dbg = document.getElementById('dbg'); dbg.setAttribute('width', pw); dbg.setAttribute('height', ph);
}, async (t, c) => {
  const [pw, ph] = c.size, W = c.w, H = c.h;
  const k = SM.keys(c.camera || [{ t: 0, zoom: 1, fx: pw / 2, fy: ph / 2 }, { t: c.duration, zoom: 1.12, fx: pw / 2, fy: ph / 2 }], t);
  const base = Math.max(W / pw, H / ph), s = base * (k.zoom || 1);           // cover the frame, then zoom toward the focus
  let x = W / 2 - k.fx * s, y = H / 2 - k.fy * s;
  x = Math.min(0, Math.max(W - pw * s, x)); y = Math.min(0, Math.max(H - ph * s, y));
  document.getElementById('cam').style.transform = `translate(${x}px, ${y}px) scale(${s})`;
  for (const { q, el, img, frame } of window._q) {
    if (frame) await frame(t * (q.fps || 30));
    else if (q.slides) { const i = Math.floor(t / (q.slideEvery || 2.5)) % q.slides.length; if (img.dataset.i !== String(i)) { img.dataset.i = i; img.src = q.slides[i]; await img.decode().catch(() => {}); } }
    if (q.paste) { const p = SM.span(t, q.paste.t0, q.paste.t1, 'inOut'); el.querySelector('img').style.clipPath = q.paste.from === 'top' ? `inset(0 0 ${100 - p * 100}% 0)` : `inset(0 ${100 - p * 100}% 0 0)`; }
    const sh = el.querySelector('.sheen'); if (sh) sh.style.transform = `translateX(${(-60 + 120 * (t / c.duration))}%)`;
  }
});
</script>
</body></html>
