<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>supermock · display ad</title>
<style>
/* An animated display ad (IAB sizes) built from the brand's tokens: three beats and an end frame. */
* { box-sizing: border-box; margin: 0; }
html, body { width: 100vw; height: 100vh; overflow: hidden; }
body { display: grid; place-items: center; background: var(--stage, #E9ECE6); }
.ad { position: relative; overflow: hidden; background: var(--ground); color: var(--ink); transform-origin: 50% 50%; outline: 1px solid rgba(0,0,0,.12); }
.ad .tex { position: absolute; inset: 0; background-image: var(--tex, none); }
.beat { position: absolute; font-family: var(--display); font-weight: 850; font-stretch: 68%; text-transform: uppercase; line-height: .88; }
.beat i { font-style: italic; font-stretch: 85%; color: var(--accent2); }
.sub { position: absolute; font-family: var(--text); font-weight: 500; line-height: 1.25; }
.fig { position: absolute; bottom: 0; }
.ring { position: absolute; fill: none; stroke: var(--line); stroke-width: 2; stroke-dasharray: 1.5 7; stroke-linecap: round; }
.cta { position: absolute; font-family: var(--text); font-weight: 700; border-radius: 999px; background: var(--accent); color: var(--accentInk); white-space: nowrap; display: inline-flex; align-items: center; }
.logo { position: absolute; }
</style></head>
<body>
<div class="ad" id="ad"><div class="tex"></div></div>
<script src="supermock.js"></script>
<script>
// config: size [w,h]; scale; tokens {ground, ink, accent, accentInk, accent2, line, stage, display, text, tex, fontsCss};
// css: optional extra CSS, so a brand can set its own headline style (.beat, .sub, .cta) rather than inherit these defaults.
// beats [{headline (may contain <i>), sub, figure, t0, t1}]; end {logo, cta, url, t0}.
const L = (w, h) => {           // layout per format
  const r = w / h;
  if (r > 3) return { kind: 'wide', head: h * .42, sub: h * .2, pad: h * .16, fig: h * 1.05, logo: h * .62, cta: h * .2 };
  if (r < .7) return { kind: 'tall', head: w * .16, sub: w * .065, pad: w * .08, fig: h * .5, logo: w * .3, cta: w * .065 };
  return { kind: 'box', head: w * .13, sub: w * .05, pad: w * .07, fig: h * .62, logo: w * .2, cta: w * .052 };
};
SM.scene(async (c) => {
  const T = c.tokens || {}, [w, h] = c.size, s = c.scale || 2, ad = document.getElementById('ad'), lay = L(w, h);
  if (c.css) { const st = document.createElement('style'); st.textContent = c.css; document.head.append(st); }
  for (const [k, v] of Object.entries({ ground: T.ground, ink: T.ink, accent: T.accent, accentInk: T.accentInk, accent2: T.accent2, line: T.line, stage: T.stage, display: T.display, text: T.text, tex: T.tex })) if (v) document.body.style.setProperty('--' + k, v);
  if (T.fontsCss) { const l = document.createElement('link'); l.rel = 'stylesheet'; l.href = T.fontsCss; document.head.appendChild(l); await new Promise((r) => { l.onload = r; l.onerror = r; }); await document.fonts.ready; }
  ad.style.width = w + 'px'; ad.style.height = h + 'px'; ad.style.transform = `scale(${s})`;
  let html = '';
  const P = lay.pad;
  c.beats.forEach((b, i) => {
    if (lay.kind === 'wide') html += `<p class="beat" data-b="${i}" style="left:${h * 1.25}px;top:${P}px;font-size:${lay.head}px">${b.headline}</p>`;   // a leaderboard has room for one line per beat: no sub
    else html += `<p class="beat" data-b="${i}" style="left:${P}px;top:${P}px;font-size:${lay.head}px;max-width:${w - P * 2}px">${b.headline}</p>${b.sub ? `<p class="sub" data-s="${i}" style="left:${P}px;top:${P + lay.head * (lay.kind === 'tall' ? 3.1 : 2.15)}px;font-size:${lay.sub}px;max-width:${w * .62}px">${b.sub}</p>` : ''}`;
    if (b.figure) html += lay.kind === 'wide' ? `<img class="fig" data-f="${i}" src="${b.figure}" style="left:${P * .4}px;height:${lay.fig}px" alt="">` : `<img class="fig" data-f="${i}" src="${b.figure}" style="right:${-w * .04}px;height:${lay.fig}px" alt="">`;
  });
  if (lay.kind !== 'wide') html += `<svg class="ring" viewBox="0 0 300 60" style="left:${w * .1}px;bottom:${h * .02}px;width:${w * .95}px"><ellipse cx="150" cy="30" rx="146" ry="24"/></svg>`;
  const E = c.end || {};
  if (lay.kind === 'wide') html += `<p class="beat" data-end style="left:${P * 1.4}px;top:${(h - lay.head * .9) / 2}px;font-size:${lay.head * .9}px">${E.headline || ''}</p><img class="logo" data-end src="${E.logo}" style="right:${P + lay.cta * 9}px;top:${(h - lay.logo) / 2}px;width:${lay.logo}px" alt=""><span class="cta" data-end style="right:${P}px;top:${(h - lay.cta * 2.4) / 2}px;font-size:${lay.cta}px;padding:${lay.cta * .7}px ${lay.cta * 1.1}px">${E.cta} →</span>`;
  else html += `<img class="logo" data-end src="${E.logo}" style="left:${(w - lay.logo) / 2}px;top:${h * (lay.kind === 'tall' ? .18 : .16)}px;width:${lay.logo}px" alt=""><p class="beat" data-end style="left:0;right:0;text-align:center;top:${h * (lay.kind === 'tall' ? .18 : .16) + lay.logo + P * .6}px;font-size:${lay.head * .8}px">${E.headline || ''}</p><span class="cta" data-end style="left:50%;top:${h * (lay.kind === 'tall' ? .66 : .7)}px;font-size:${lay.cta}px;padding:${lay.cta * .7}px ${lay.cta * 1.2}px">${E.cta} →</span>${E.url ? `<p class="sub" data-end style="left:0;right:0;text-align:center;bottom:${P * .7}px;font-size:${lay.sub * .8}px">${E.url}</p>` : ''}`;
  ad.insertAdjacentHTML('beforeend', html);
  await Promise.all([...ad.querySelectorAll('img')].map((i) => i.decode().catch(() => {})));
}, async (t, c) => {
  const ad = document.getElementById('ad'), [w, h] = c.size, wide = w / h > 3;
  c.beats.forEach((b, i) => {
    const inn = SM.span(t, b.t0, b.t0 + .55, 'spring'), out = SM.span(t, b.t1 - .3, b.t1, 'out'), v = inn * (1 - out);
    ad.querySelectorAll(`[data-b="${i}"]`).forEach((e) => { e.style.opacity = v; e.style.transform = `translateY(${(1 - inn) * 24 - out * 12}px)`; });
    ad.querySelectorAll(`[data-s="${i}"]`).forEach((e) => { const k = SM.span(t, b.t0 + .25, b.t0 + .8, 'out') * (1 - out); e.style.opacity = k; e.style.transform = `translateY(${(1 - k) * 10}px)`; });
    ad.querySelectorAll(`[data-f="${i}"]`).forEach((e) => { const k = SM.span(t, b.t0 + .1, b.t0 + .7, 'spring'); e.style.opacity = Math.min(1, k * 1.4) * (1 - out); e.style.transform = `translateY(${(1 - k) * (wide ? 30 : 60)}px) rotate(${(1 - k) * -6}deg)`; });
  });
  const E = c.end || {}, e0 = E.t0 ?? 5.4;
  ad.querySelectorAll('[data-end]').forEach((e, j) => { const k = SM.span(t, e0 + j * .12, e0 + j * .12 + .55, 'spring');
    const pulse = e.classList.contains('cta') ? 1 + Math.max(0, Math.sin((t - e0 - 1.2) * 4)) * .04 * (t > e0 + 1.2 ? 1 : 0) : 1;
    e.style.opacity = Math.min(1, k * 1.3); e.style.transform = `${e.classList.contains('cta') && !wide ? 'translateX(-50%) ' : ''}translateY(${(1 - k) * 16}px) scale(${pulse})`; });
  const ring = ad.querySelector('.ring'); if (ring) ring.style.opacity = SM.span(t, .2, .9) * (1 - SM.span(t, e0 - .3, e0));
});
</script>
</body></html>
