<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>supermock · device</title>
<style>
/* A device on a seamless studio ground, drawn in CSS 3D. The screen plays a captured frame sequence. */
* { box-sizing: border-box; margin: 0; }
html, body { width: 100vw; height: 100vh; overflow: hidden; }
body { background: var(--bg, #E9ECE6); font-family: system-ui, sans-serif; }
.studio { position: absolute; inset: 0; perspective: 3400px; perspective-origin: 50% 35%; }
.floor { position: absolute; left: 50%; top: 50%; width: 1600px; height: 120px; border-radius: 50%; background: radial-gradient(closest-side, rgba(0,0,0,.28), rgba(0,0,0,0)); transform: translate(-50%, 0); filter: blur(6px); }
.rig { position: absolute; left: 50%; top: 50%; transform-style: preserve-3d; }
.device { position: absolute; transform-style: preserve-3d; }
.screen { position: absolute; overflow: hidden; background: #000; }
.screen img { display: block; width: 100%; height: auto; }
.glare { position: absolute; inset: 0; pointer-events: none; background: linear-gradient(115deg, rgba(255,255,255,0) 30%, rgba(255,255,255,.10) 45%, rgba(255,255,255,0) 60%); background-size: 300% 100%; mix-blend-mode: screen; }
/* phone */
.phone { border-radius: 64px; background: #16181A; box-shadow: inset 0 0 0 2px #3A3D40, inset 0 0 0 6px #0B0C0D; }
.phone .screen { border-radius: 50px; }
.phone .island { position: absolute; left: 50%; top: 26px; width: 120px; height: 34px; border-radius: 20px; background: #000; transform: translateX(-50%); z-index: 2; }
.phone .side { position: absolute; right: -4px; top: 210px; width: 4px; height: 90px; border-radius: 2px; background: #2A2D30; }
/* tablet */
.tablet { border-radius: 44px; background: #1A1C1E; box-shadow: inset 0 0 0 2px #3A3D40; }
.tablet .screen { border-radius: 22px; }
/* laptop */
.lid { position: absolute; border-radius: 20px 20px 6px 6px; background: #121314; box-shadow: inset 0 0 0 2px #2B2E31; transform-origin: 50% 100%; transform-style: preserve-3d; }
.lid .screen { border-radius: 6px; }
.lid .cam { position: absolute; left: 50%; top: 9px; width: 8px; height: 8px; border-radius: 50%; background: #2C3034; transform: translateX(-50%); }
.base { position: absolute; transform-origin: 50% 0; transform: rotateX(90deg); border-radius: 0 0 22px 22px; background: linear-gradient(#D9DCDF, #C5C9CD); }
.base::before { content: ""; position: absolute; left: 50%; top: 0; width: 26%; height: 14px; transform: translateX(-50%); border-radius: 0 0 10px 10px; background: #B5B9BD; }
.base .keys { position: absolute; left: 7%; right: 7%; top: 7%; height: 50%; border-radius: 12px; background: repeating-linear-gradient(90deg, transparent 0 calc(100% / 15 - 7px), #CDD1D5 calc(100% / 15 - 7px) calc(100% / 15)), repeating-linear-gradient(0deg, transparent 0 calc(100% / 6 - 7px), #CDD1D5 calc(100% / 6 - 7px) calc(100% / 6)), #34383C; }
.base .pad { position: absolute; left: 50%; bottom: 8%; width: 30%; height: 30%; transform: translateX(-50%); border-radius: 12px; background: #C0C4C8; box-shadow: inset 0 0 0 1px #AEB2B6; }
.lip { position: absolute; background: #AEB2B6; border-radius: 0 0 14px 14px; }
.caption { position: absolute; left: 72px; bottom: 60px; color: var(--ink, #0E2318); }
.caption b { display: block; font: 800 34px/1 var(--font, system-ui); letter-spacing: -.01em; }
.caption span { display: block; margin-top: 8px; font: 500 20px/1.3 system-ui; opacity: .75; }
</style></head>
<body>
<div class="studio"><div class="floor"></div><div class="rig" id="rig"></div></div>
<div class="caption" id="cap"></div>
<script src="supermock.js"></script>
<script>
// config: device phone|tablet|laptop; frames, count, captureFps; screen [w,h] capture CSS px; bg; ink;
// camera [{t, rx, ry, rz, s, x, y}] (degrees, scale, px); caption {title, sub}; font.
SM.scene(async (c) => {
  document.body.style.setProperty('--bg', c.bg || '#E9ECE6'); if (c.ink) document.body.style.setProperty('--ink', c.ink);
  if (c.font) document.body.style.setProperty('--font', c.font);
  const rig = document.getElementById('rig'), [sw, sh] = c.screen || [390, 844];
  let html = '', screenW, screenH, devW, devH;
  if (c.device === 'laptop') {
    screenW = 1180; screenH = Math.round(screenW * sh / sw); const lw = screenW + 48, lh = screenH + 60;
    devW = lw; devH = lh;
    html = `<div class="device" style="left:${-lw / 2}px;top:${-lh / 2 - 60}px;width:${lw}px;height:${lh}px">
      <div class="lid" style="width:${lw}px;height:${lh}px"><div class="cam"></div><div class="screen" style="left:24px;top:30px;width:${screenW}px;height:${screenH}px"><img id="scr" alt=""><div class="glare" id="glare"></div></div></div>
      <div class="base" style="left:-80px;top:${lh}px;width:${lw + 160}px;height:${Math.round(lw * .52)}px"><div class="keys"></div><div class="pad"></div></div>
      <div class="lip" style="left:-80px;top:${lh}px;width:${lw + 160}px;height:16px"></div></div>`;
  } else {
    const isPhone = c.device !== 'tablet', bez = isPhone ? 16 : 26;
    screenH = isPhone ? 780 : 820; screenW = Math.round(screenH * sw / sh); devW = screenW + bez * 2; devH = screenH + bez * 2;
    html = `<div class="device ${isPhone ? 'phone' : 'tablet'}" style="left:${-devW / 2}px;top:${-devH / 2 - 20}px;width:${devW}px;height:${devH}px">
      ${isPhone ? '<div class="island"></div><div class="side"></div>' : ''}
      <div class="screen" style="left:${bez}px;top:${bez}px;width:${screenW}px;height:${screenH}px"><img id="scr" alt=""><div class="glare" id="glare"></div></div></div>`;
  }
  rig.innerHTML = html;
  document.querySelector('.floor').style.top = `calc(50% + ${devH / 2 - 30}px)`;
  window._frame = SM.seq(document.getElementById('scr'), c.frames, c.count);
  window._dev = rig.firstElementChild;
  if (c.caption) document.getElementById('cap').innerHTML = `<b>${c.caption.title || ''}</b><span>${c.caption.sub || ''}</span>`;
}, async (t, c) => {
  const cam = SM.keys(c.camera || [{ t: 0, ry: -14, rx: 6, s: 1 }, { t: c.duration, ry: 10, rx: 4, s: 1.04 }], t);
  const rig = document.getElementById('rig');
  rig.style.transform = `translate(${cam.x || 0}px, ${cam.y || 0}px) scale(${cam.s ?? 1}) rotateX(${cam.rx || 0}deg) rotateY(${cam.ry || 0}deg) rotateZ(${cam.rz || 0}deg)`;
  if (c.device === 'laptop') document.querySelector('.lid').style.transform = `rotateX(${cam.lid ?? 10}deg)`;
  document.getElementById('glare').style.backgroundPosition = `${100 - (t / c.duration) * 100}% 0`;
  // the screen recording: hold the first frame for "lead" seconds, then play at the capture rate
  const lead = c.lead ?? 0.4;
  await window._frame(Math.max(0, t - lead) * (c.captureFps || 30));
  document.getElementById('cap').style.opacity = c.caption ? String(SM.span(t, .3, 1.1, 'out')) : '0';
});
</script>
</body></html>
