<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lagging-columns — clean-room example (Ferrous, invented brand)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/norwester@5.3.0/400.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/hanken-grotesk@5.3.0/wght.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/hanken-grotesk@5.3.0/wght-italic.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/geist-mono@5.3.0/wght.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/geist-mono@5.3.0/wght-italic.css">
<style id="fd-fonts">:root { --fd-display: 'Norwester', sans-serif; --fd-body: 'Hanken Grotesk Variable', sans-serif; --fd-mono: 'Geist Mono Variable', monospace; } html { font-synthesis: none; }</style>
<link rel="stylesheet" href="src/lagging-columns.css">
<style>
  /* Clean-room brand: a hardware catalogue of product cards, not portrait photography. */
  * { box-sizing: border-box; margin: 0; }
  body { background: #e7e5e0; color: #1d2124; font: 1rem/1.4 var(--fd-body); }
  header { padding: 18vh 5vw 10vh; }
  h1 { font: 800 clamp(3rem, 10vw, 9rem)/.85 var(--fd-display); text-transform: uppercase; }
  .eyebrow { font: 600 .72rem/1 var(--fd-mono); letter-spacing: .1em; text-transform: uppercase; margin-bottom: 1rem; }
  .lc-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 2.5rem 1.5rem; padding: 0 5vw 40vh; }
  .card { color: inherit; text-decoration: none; display: block; background: #f6f5f2; border: 1px solid #c9c6bf; padding: 1rem; }
  .card .pic { aspect-ratio: 1; background: url(../_example/img/iron.svg) center/cover; margin-bottom: .8rem; }
  .card:nth-child(3n) .pic { background-image: url(../_example/img/rope.svg); }
  .card h3 { font: 700 1rem/1.2 var(--fd-body); }
  .card p { font: .8rem/1.3 var(--fd-mono); color: #6b6a66; margin-top: .3rem; }
</style>
</head>
<body>
  <header><p class="eyebrow">01 — Catalogue</p><h1>Ferrous<br>hardware</h1></header>
  <main class="lc-grid" id="grid"></main>
<script type="module">
  import { mountLaggingColumns } from './src/lagging-columns.js';
  const names = ['Butt hinge', 'Thumb latch', 'Tee hinge', 'Bolt', 'Pull handle', 'Hook and eye', 'Strap hinge', 'Ring pull', 'Gate latch', 'Hasp', 'Cabin hook', 'Escutcheon'];
  const grid = document.getElementById('grid');
  grid.innerHTML = Array.from({ length: 36 }, (_, i) => `<a class="card" href="#"><div class="pic" role="img" aria-label="Iron plate, original artwork"></div><h3>${names[i % names.length]}</h3><p>[fill in: size] · [fill in: price]</p></a>`).join('');
  mountLaggingColumns(grid);
</script>
</body>
</html>
