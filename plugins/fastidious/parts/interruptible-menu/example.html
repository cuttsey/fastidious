<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>interruptible-menu — clean-room example (Ferrous, invented brand)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/bebas-neue@5.3.0/400.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/geist@5.3.0/wght.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/geist@5.3.0/wght-italic.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/geist-mono@5.3.0/wght.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/geist-mono@5.3.0/wght-italic.css">
<style id="fd-fonts">:root { --fd-display: 'Bebas Neue', sans-serif; --fd-body: 'Geist Variable', sans-serif; --fd-mono: 'Geist Mono Variable', monospace; } html { font-synthesis: none; }</style>
<script type="importmap">
{ "imports": {
  "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.15.1/index.js",
  "gsap/": "https://cdn.jsdelivr.net/npm/gsap@3.15.1/"
} }
</script>
<link rel="stylesheet" href="src/interruptible-menu.css">
<style>
  /* Clean-room brand: an ironmonger's site, rust menu over iron-grey, no game UI or video. */
  :root { --im-bg: #b4471f; --im-ink: #f4efe8; }
  * { box-sizing: border-box; margin: 0; }
  body { background: #2b2f33; color: #eef0f1; font: 1rem/1.4 var(--fd-body); min-height: 100vh; overflow: hidden; }
  header { position: fixed; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: center; padding: 1.5rem 4vw; z-index: 900; }
  .mark { font: 800 1.1rem/1 var(--fd-display); letter-spacing: .04em; text-transform: uppercase; }
  .im-toggle { font: 600 .8rem/1 var(--fd-mono); text-transform: uppercase; letter-spacing: .1em; color: inherit; background: none; border: 1px solid currentColor; padding: .7rem 1.1rem; cursor: pointer; }
  .stage { position: fixed; inset: 0; display: grid; place-items: center; }
  .stage h1 { font: 800 clamp(3rem, 14vw, 13rem)/.82 var(--fd-display); text-transform: uppercase; text-align: center; }
  .tile { position: fixed; width: 9vw; aspect-ratio: 1; background: url(../_example/img/iron.svg) center/cover; border: 1px solid #555; }
  .im-menu a { font: 800 clamp(2rem, 6vw, 5rem)/1 var(--fd-display); text-transform: uppercase; color: inherit; text-decoration: none; text-align: center; }
  .im-menu a:focus-visible { outline: 2px solid currentColor; outline-offset: 6px; }
</style>
</head>
<body>
  <header><span class="mark">Ferrous</span><button class="im-toggle" id="toggle">Menu</button></header>
  <div class="stage"><h1>Forged<br>[fill in: city]</h1></div>
  <div class="tile" style="left:8vw;top:20vh"></div><div class="tile" style="right:10vw;top:16vh"></div>
  <div class="tile" style="left:16vw;bottom:14vh"></div><div class="tile" style="right:18vw;bottom:20vh"></div>
  <nav class="im-menu" id="menu" aria-label="Main">
    <a href="#">Hinges</a><a href="#">Latches</a><a href="#">Handles</a><a href="#">Commissions</a><a href="#">Visit the forge</a>
  </nav>
<script type="module">
  import { mountInterruptibleMenu } from './src/interruptible-menu.js';
  window.menuApi = mountInterruptibleMenu({
    toggle: document.getElementById('toggle'),
    menu: document.getElementById('menu'),
    scatter: [...document.querySelectorAll('.tile')],
  });
</script>
</body>
</html>
