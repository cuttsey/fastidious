<title>drifting-words — clean-room example (Ferrous, invented brand)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/archivo-narrow@5.3.0/wght.css">

<style id="fd-fonts">:root { --fd-display: 'Archivo Narrow Variable', sans-serif; --fd-body: 'Hanken Grotesk Variable', sans-serif; --fd-mono: 'Trispace Variable', monospace; } html { font-synthesis: none; }</style>
<script type="importmap">
{ "imports": {

  "gsap/": "https://cdn.jsdelivr.net/npm/gsap@3.15.1/"
} }
</script>
<link rel="stylesheet" href="src/drifting-words.css">
<style>
  /* Clean-room brand: an ironmonger's vocabulary on warm iron-grey, condensed caps, rust initials. */
  * { box-sizing: border-box; margin: 0; }
  body { background: #2b2f33; color: #eef0f1; }
  .dw { padding: 30vh 3vw 50vh; font: 600 .95rem/1.15 var(--fd-mono); text-transform: uppercase; letter-spacing: .06em; --dw-space: 22vh; }
  .dw-xl { font: 800 clamp(8rem, 30vw, 26rem)/.8 var(--fd-display); color: #c9583a; letter-spacing: -.02em; }
  .cap { position: fixed; left: 3vw; bottom: 3vh; font: 600 .7rem/1 var(--fd-mono); letter-spacing: .1em; text-transform: uppercase; opacity: .6; }
</style>
</head>
<body>
  <main class="dw" id="dw">
      <div data-dw data-dw-home="2" data-dw-away="6">Bar</div>

      <div class="dw-break"></div>
      <div data-dw data-dw-home="1" data-dw-away="4" class="dw-xl">R</div>

  <p class="cap">Ferrous — the words of the forge. Clean-room example, invented brand.</p>
<script type="module">
